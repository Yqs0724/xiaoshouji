  <div class="view" id="view-chat">
    <header class="wx-bar">
      <button type="button" class="back" id="btnChatBack" title="回桌面" aria-label="回桌面">←</button>
      <div class="who" id="chatPeerName">家机</div>
    </header>
    <div class="wx-thread" id="chatThread" aria-live="polite"></div>
    <div class="wx-err" id="chatErr" hidden></div>
    <form class="wx-composer" id="chatForm">
      <input id="dailyChatInput" type="text" maxlength="800" placeholder="" autocomplete="off" />
      <button type="button" class="wx-hold" id="btnChatHold" hidden>按住 说话</button>
      <button type="button" class="wx-icon-btn" id="btnChatSticker" title="表情" aria-label="表情" aria-pressed="false">表情</button>
      <button type="button" class="wx-icon-btn" id="btnChatPlus" title="更多" aria-label="更多" aria-pressed="false">+</button>
      <button type="submit" class="wx-send" id="btnChatSend" hidden>发送</button>
      <input id="chatImageInput" type="file" accept="image/*" hidden />
      <input id="chatCameraInput" type="file" accept="image/*" capture="environment" hidden />
      <input id="chatStickerInput" type="file" accept="image/*" hidden />
    </form>
    <div class="wx-panel wx-stickers" id="chatStickerPanel" hidden></div>
    <div class="wx-panel wx-plus" id="chatPlusPanel" hidden></div>
    <div class="wx-modal" id="chatSheet" hidden>
      <div class="wx-sheet-card">
        <div class="wx-sheet-title" id="chatSheetTitle">标题</div>
        <label class="wx-sheet-field" id="chatSheetAmountWrap" hidden>
          <span>金额</span>
          <input id="chatSheetAmount" type="number" min="0.01" step="0.01" inputmode="decimal" />
        </label>
        <label class="wx-sheet-field" id="chatSheetNoteWrap" hidden>
          <span id="chatSheetNoteLab">备注</span>
          <input id="chatSheetNote" type="text" maxlength="40" />
        </label>
        <label class="wx-sheet-field" id="chatSheetNameWrap" hidden>
          <span>位置</span>
          <input id="chatSheetName" type="text" maxlength="40" />
        </label>
        <label class="wx-sheet-field" id="chatSheetDetailWrap" hidden>
          <span>补充</span>
          <input id="chatSheetDetail" type="text" maxlength="80" />
        </label>
        <div class="wx-sheet-actions">
          <button type="button" id="chatSheetCancel">取消</button>
          <button type="button" class="primary" id="chatSheetOk">发送</button>
        </div>
      </div>
    </div>
    <div class="wx-modal" id="chatCallPick" hidden>
      <div class="wx-sheet-card wx-call-pick">
        <div class="wx-sheet-title">通话</div>
        <button type="button" class="wx-call-pick-btn" id="chatCallPickVoice">语音通话</button>
        <button type="button" class="wx-call-pick-btn" id="chatCallPickVideo">视频通话</button>
        <button type="button" class="wx-call-pick-cancel" id="chatCallPickCancel">取消</button>
      </div>
    </div>
    <div class="wx-modal" id="chatCallModal" hidden>
      <div class="wx-call-card">
        <div class="wx-call-kind" id="chatCallKind">语音通话</div>
        <div class="wx-call-peer" id="chatCallPeer">家机</div>
        <div class="wx-call-state" id="chatCallState">等待接听…</div>
        <button type="button" class="wx-call-hang" id="chatCallHang">挂断</button>
      </div>
    </div>
    <div class="wx-hist" id="chatHist" hidden>
      <div class="wx-hist-top">
        <input id="chatHistQ" type="search" placeholder="搜索" autocomplete="off" />
        <button type="button" id="chatHistCancel">取消</button>
      </div>
      <div class="wx-hist-home" id="chatHistHome">
        <div class="wx-hist-sec">搜索指定内容</div>
        <div class="wx-hist-grid" id="chatHistGrid"></div>
      </div>
      <div class="wx-hist-dates" id="chatHistDates" hidden>
        <div class="wx-cal-head">
          <button type="button" class="wx-cal-back" id="chatHistDateBack" aria-label="返回">‹</button>
          <div class="wx-cal-head-title">按日期搜寻</div>
        </div>
        <div class="wx-cal-sticky">
          <button type="button" class="wx-cal-jump" id="chatHistCalJump">
            <span id="chatHistCalJumpLab">—</span>
            <span class="wx-cal-chev" aria-hidden="true">▾</span>
          </button>
          <input type="month" id="chatHistCalMonth" class="wx-cal-month-input" tabindex="-1" />
          <div class="wx-cal-wdays" aria-hidden="true">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
        </div>
        <div class="wx-cal-scroll" id="chatHistCal"></div>
      </div>
      <div class="wx-hist-list" id="chatHistList" hidden></div>
    </div>
  </div>
