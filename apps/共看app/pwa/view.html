  <div class="view" id="view-cowatch">
    <header class="cw-bar">
      <button type="button" class="back" id="btnCowatchBack" title="回桌面" aria-label="回桌面">←</button>
      <div class="title">共看</div>
      <div class="cw-bar-actions">
        <button type="button" class="scan" id="btnCowatchScan" title="扫描 media/watch 补登记">扫库</button>
        <button type="button" class="add" id="btnCowatchAdd">加入</button>
      </div>
    </header>
    <input id="cowatchFile" type="file" accept="video/*,.mp4,.webm,.mkv,.mov,.m4v,.avi,.ogv" hidden />
    <div class="cw-list" id="cowatchList" aria-label="片单"></div>
    <div class="cw-msg" id="cowatchMsg"></div>
    <p class="cw-note">点片名进播放场；「扫库」登记已放进片库目录的视频；「结束本场」关场；备份不含原片。</p>
  </div>
