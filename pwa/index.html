<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>共读小屋</title>
  <style>
    :root {
      --paper: #f7f1e8;
      --ink: #3a2e24;
      --muted: #8a7a6a;
      --accent: #8b5a3c;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .standby {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #d5e0e8 0%, var(--paper) 40%);
    }
    .ambient {
      height: 56px;
      margin: 14px 16px 0;
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(255,255,255,.4), rgba(255,210,150,.5), rgba(255,255,255,.25));
      animation: breathe 4.2s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: .7; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ambient { animation: none; }
    }
    .standby-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      padding: 20px;
    }
    .greet { font-size: 26px; font-weight: 500; }
    .continue-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      color: var(--accent);
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(139, 90, 60, .3);
      background: rgba(139, 90, 60, .08);
      cursor: pointer;
      user-select: none;
    }
    .swipe-hint {
      padding-bottom: calc(24px + var(--safe-bottom));
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="standby">
    <div class="ambient" aria-hidden="true"></div>
    <div class="standby-body">
      <div class="greet">嗨，我在这儿</div>
      <div class="continue-row" id="continue" role="button" tabindex="0">《三体》· 继续</div>
    </div>
    <div class="swipe-hint" id="swipeHint">∧ 上滑进入小屋</div>
  </div>
  <script>
    // 占位：0.3 再接真实跳转
    function noop(e) { e.preventDefault(); }
    document.getElementById("continue").addEventListener("click", noop);
    document.getElementById("swipeHint").addEventListener("click", noop);
  </script>
</body>
</html>
